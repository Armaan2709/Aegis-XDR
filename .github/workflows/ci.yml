name: AegisAI XDR CI/CD Pipeline Validation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-checks:
    name: Backend Compilation & Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio anyio pydantic pydantic-settings alembic redis elasticsearch sqlalchemy asyncpg slowapi starlette httpx

      - name: Python Bytecode Compilation Check
        run: |
          python -m compileall backend/app tests

      - name: Run Security Suite
        run: |
          python -m pytest tests/security

      - name: Run Complete Test Suite
        run: |
          python -m pytest

  frontend-checks:
    name: Frontend TypeScript & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: TypeScript Type Check
        working-directory: ./frontend
        run: |
          npx tsc --noEmit

      - name: Frontend Production Build
        working-directory: ./frontend
        run: |
          npm run build

  docker-checks:
    name: Docker Production Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
